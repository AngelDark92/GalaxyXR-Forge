name: add-news

# A visitor submits the "Post news" form on the Pages site (or files an issue with
# the `add-news` label / a `News: ` title). This turns the issue into a news.d/
# post, regenerates README/CHANGELOG/site, and opens a pull request for review —
# the issue is never trusted for anything but the content fields.

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: add-news-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  propose:
    # The label is the intended marker; the title prefix keeps the flow working
    # before the label exists (the parser still validates every field and the PR
    # is reviewed before merge).
    if: >
      contains(github.event.issue.labels.*.name, 'add-news') ||
      startsWith(github.event.issue.title, 'News:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse the issue
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          if ! python tools/issue-payload.py --news > payload.json; then
            echo "::error::Could not parse this issue. Use the Post news form on the site, or the issue template."
            exit 1
          fi
          cat payload.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("payload.json"))
          print("title=" + p["title"])
          print("date=" + p["date"])
          PY

      - name: Add the post
        id: add
        run: |
          set +e
          python tools/add-news.py --json payload.json --no-checks
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::notice::Already posted; nothing to do."
          elif [ "$code" -ne 0 ]; then
            echo "::error::add-news.py failed with exit $code"
            exit 1
          fi

      - name: Commit a branch and open a pull request
        if: steps.add.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ steps.parse.outputs.title }}
        run: |
          set -euo pipefail
          BRANCH="add-news/issue-${ISSUE}"
          git config user.name "gxr-forge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add news.d docs/index.html README.md CHANGELOG.md docs/catalog-index.json docs/news.json
          # The title is untrusted issue text: pass it as a printf argument, never
          # inside the format string, so quotes, $ and backticks stay literal.
          git commit -m "$(printf 'feat: news post %s (issue #%s)' "$TITLE" "$ISSUE")"
          git push -f origin "$BRANCH"
          BODY=$(printf 'Adds a news post from issue #%s, generated by `tools/add-news.py`. Nothing is published until a maintainer merges it.\n\nCloses #%s\n\n- [ ] title reads well\n- [ ] body is accurate and complete\n- [ ] date is right (a post keeps the date it was written, not the merge date)\n- [ ] category is right (site, release, community, guide)\n- generated README/CHANGELOG/site are in the commit\n' "$ISSUE" "$ISSUE")
          if gh pr list --head "$BRANCH" --json number --jq '.[].number' | grep -q .; then
            PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            gh pr comment "$PR" --body "Updated from issue #${ISSUE}." >/dev/null 2>&1 || true
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$(printf 'Post news: %s' "$TITLE")" \
              --body "$BODY"
          fi
          # A branch pushed with GITHUB_TOKEN does not fire `pull_request`, so the
          # validate workflow would never run on this PR. Dispatch it on the branch.
          gh workflow run validate.yml --ref "$BRANCH" || true

      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.add.outputs.code }}
        run: |
          if [ "${OUTCOME:-}" = "0" ]; then
            gh issue comment "$ISSUE" --body "Queued a pull request: branch \`add-news/issue-${ISSUE}\`. Review it under Pull requests; merging publishes the post." || true
          elif [ "${OUTCOME:-}" = "2" ]; then
            gh issue comment "$ISSUE" --body "That post is already queued or published (same date and title, or a post already came from this issue). Nothing was opened; edit the existing pull request instead." || true
          fi
