name: add-repo

# A visitor submits the "Suggest a repo" form on the Pages site (or files an issue with
# the `add-repo` label). This turns the issue into a compliant catalog entry,
# regenerates README/CHANGELOG/site, and opens a pull request for review — the
# issue is never trusted for anything but the repo URL and the group.

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: add-repo-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  propose:
    if: contains(github.event.issue.labels.*.name, 'add-repo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse the issue
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! python tools/issue-payload.py > payload.json; then
            echo "::error::Could not parse this issue. Use the Suggest a repo form on the site, or the issue template."
            exit 1
          fi
          cat payload.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("payload.json"))
          print("repo=" + p["repo"])
          print("group=" + p["group"])
          PY

      - name: Add the entry
        id: add
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python tools/add-repo.py --json payload.json --no-checks
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::notice::Already listed or already proposed; nothing to do."
          elif [ "$code" -ne 0 ]; then
            echo "::error::add-repo.py failed with exit $code"
            exit 1
          fi

      - name: Commit a branch and open a pull request
        if: steps.add.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          REPO="${{ steps.parse.outputs.repo }}"
          GROUP="${{ steps.parse.outputs.group }}"
          BRANCH="add-repo/issue-${ISSUE}"
          git config user.name "gxr-forge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add catalog.d changelog.d README.md CHANGELOG.md docs/index.html docs/catalog-index.json docs/news.json
          git commit -m "feat: add ${REPO#https://github.com/} (issue #${ISSUE})"
          git push -f origin "$BRANCH"
          BODY=$(printf 'Adds %s to the **%s** group, generated by `tools/add-repo.py` from issue #%s.\n\nCloses #%s\n\n- [ ] about line reads well\n- [ ] group is right\n- generated README/CHANGELOG/site are in the commit\n' "$REPO" "$GROUP" "$ISSUE" "$ISSUE")
          if gh pr list --head "$BRANCH" --json number --jq '.[].number' | grep -q .; then
            PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            gh pr comment "$PR" --body "Updated from issue #${ISSUE}." >/dev/null 2>&1 || true
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Add ${REPO#https://github.com/} to the catalog" \
              --body "$BODY"
          fi
          # A branch pushed with GITHUB_TOKEN does not fire `pull_request`, so the
          # validate workflow would never run on this PR. Dispatch it on the branch.
          gh workflow run validate.yml --ref "$BRANCH" || true

      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.add.outputs.code }}
        run: |
          if [ "${OUTCOME:-}" = "0" ]; then
            gh issue comment "$ISSUE" --body "Queued a pull request: branch \`add-repo/issue-${ISSUE}\`. Review it under Pull requests; merging rebuilds the site." || true
          elif [ "${OUTCOME:-}" = "2" ]; then
            gh issue comment "$ISSUE" --body "That repository is already in the catalog, or already has an open issue or pull request. Nothing was opened; follow the existing one." || true
          fi
