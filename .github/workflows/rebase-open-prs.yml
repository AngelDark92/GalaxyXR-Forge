name: rebase-open-prs

# Keeps open PRs mergeable without hand-resolving generated files: when main moves,
# every open in-repo PR is rebased. A clean rebase is pushed as-is; a conflict is
# rebuilt by tools/repair-add-pr.py, which keeps the entry and its original `added`
# date and takes main's README/CHANGELOG/docs.
#
# Fork PRs are skipped: this workflow cannot push to someone else's branch. The
# add-repo issue flow exists for outside contributions.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to repair (blank: every open in-repo PR)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: rebase-open-prs
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebase open PRs onto main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.pr }}
        run: |
          set -uo pipefail
          git config user.name "gxr-forge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${ONLY:-}" ]; then
            LIST="$ONLY"
          else
            LIST=$(gh pr list --state open --json number,isCrossRepository \
              --jq '.[] | select(.isCrossRepository==false) | .number')
          fi

          if [ -z "$LIST" ]; then
            echo "No open in-repo pull requests."
            exit 0
          fi

          for n in $LIST; do
            BR=$(gh pr view "$n" --json headRefName --jq .headRefName)
            echo "::group::PR #$n ($BR)"
            git fetch origin "$BR" main
            git checkout -B "$BR" "origin/$BR"
            BEFORE=$(git rev-parse HEAD)

            if git rebase origin/main >/dev/null 2>&1; then
              if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
                git push --force-with-lease origin "HEAD:$BR"
                echo "rebased cleanly and pushed"
              else
                echo "already up to date"
              fi
            else
              git rebase --abort || true
              echo "conflict: rebuilding the branch from its own entry"
              # Run repair from MAIN's copy: the branch checkout just replaced
              # tools/ with the branch's (possibly older) version.
              git show origin/main:tools/repair-add-pr.py > "$RUNNER_TEMP/repair-add-pr.py"
              if python "$RUNNER_TEMP/repair-add-pr.py" --root "$GITHUB_WORKSPACE" --main origin/main; then
                git push --force-with-lease origin "HEAD:$BR"
              else
                gh pr comment "$n" --body "Automatic rebase failed: this PR changes more than one catalog entry or edits a generated file. Rebase locally with 'git fetch origin && git rebase origin/main', then 'python tools/repair-add-pr.py --main origin/main' and 'python tools/build.py'." || true
              fi
            fi

            # A branch pushed by this workflow does not fire `pull_request`, so make
            # sure the required check exists for the head commit.
            SHA=$(git rev-parse HEAD)
            RUNS=$(gh run list --workflow=validate.yml --commit "$SHA" --json databaseId --jq 'length' 2>/dev/null || echo 0)
            if [ "${RUNS:-0}" = "0" ]; then
              gh workflow run validate.yml --ref "$BR" || true
              echo "dispatched validate for $SHA"
            fi
            echo "::endgroup::"
          done
